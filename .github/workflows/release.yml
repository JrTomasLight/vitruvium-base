# Сборка релиза системы для Foundry VTT.
#
# Запускается при пуше тега вида v0.1.0:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Что делает:
# 1. Собирает vitruvium.zip скриптом scripts/package.mjs: только файлы,
#    нужные Foundry, а в system.json — версия из тега и ссылка download
#    на архив именно этого релиза.
# 2. Создаёт релиз на GitHub и прикладывает к нему vitruvium.zip и system.json.
#
# Foundry проверяет обновления по ссылке manifest из system.json:
# releases/latest/download/system.json, то есть по последнему релизу.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Собрать архив системы
        # Версия берётся из тега и прописывается в system.json вместе со ссылкой
        # на архив этого релиза. Список файлов архива — в scripts/package.mjs.
        run: node scripts/package.mjs --version "$GITHUB_REF_NAME" --out .

      - name: Создать релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" vitruvium.zip system.json \
            --title "Витрувий ${GITHUB_REF_NAME}" \
            --generate-notes
