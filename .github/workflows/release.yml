# Сборка релиза системы для Foundry VTT.
#
# Запускается при пуше тега вида v0.1.0:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Что делает:
# 1. Берёт версию из тега и прописывает её в system.json,
#    вместе со ссылкой download на архив именно этого релиза.
# 2. Собирает vitruvium.zip только из файлов, нужных Foundry.
# 3. Создаёт релиз на GitHub и прикладывает к нему vitruvium.zip и system.json.
#
# Foundry проверяет обновления по ссылке manifest из system.json:
# releases/latest/download/system.json, то есть по последнему релизу.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Прописать версию и ссылку на архив в system.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DOWNLOAD="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/vitruvium.zip"
          jq --arg version "$VERSION" --arg download "$DOWNLOAD" \
            '.version = $version | .download = $download' system.json > system.json.tmp
          mv system.json.tmp system.json

      - name: Собрать архив системы
        run: zip -r vitruvium.zip system.json module lang styles templates fonts assets README.md

      - name: Создать релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" vitruvium.zip system.json \
            --title "Витрувий ${GITHUB_REF_NAME}" \
            --generate-notes
