# Проверки системы на GitHub. Сам Foundry здесь не запускается.
#
# Запускаются при пуше в main и features и в pull request.
#
# - test: автотесты (`npm test`), нужные части Foundry заменены заглушками
#   (tests/helpers/foundry.mjs). Без зависимостей.
# - lint: ESLint по коду, тестам и скриптам и проверка Handlebars-шаблонов
#   (`npm run lint`, пакеты ставятся `npm ci`).
# - preview: превью листа, окон и карточек чата со стилями и шаблонами системы
#   (`npm run preview`), скриншоты в тёмной и светлой теме и проверка доступности
#   axe-core. Скриншоты — в «Artifacts» запуска. Падает при нарушениях уровня
#   serious и critical.
# - changelog: предупреждение (не ошибка), если в пуше или PR поменялся код
#   системы, а CHANGELOG.md — нет.
# - package: собирает vitruvium.zip тем же скриптом, что и релиз
#   (scripts/package.mjs), и прикладывает к запуску. Архив можно скачать
#   внизу страницы запуска, в «Artifacts», и поставить в Foundry вручную.

name: Tests

on:
  push:
    branches: [main, features]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Запустить тесты
        run: npm test

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установить пакеты для разработки
        run: npm ci

      - name: ESLint и шаблоны
        run: npm run lint

  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установить пакеты и браузер
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Превью, скриншоты и доступность
        run: npm run preview -- --out preview

      - name: Итог проверки доступности
        if: always()
        run: |
          {
            echo "## Доступность (axe-core)"
            echo
            echo '```'
            cat preview/accessibility.txt 2>/dev/null || echo "Отчёта нет: превью не собралось, смотрите лог."
            echo '```'
            echo
            echo "Скриншоты — внизу страницы, в «Artifacts»."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Приложить скриншоты к запуску
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ github.sha }}
          path: preview/
          retention-days: 30
          if-no-files-found: warn

  package:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Собрать архив системы
        run: node scripts/package.mjs --out build

      - name: Приложить архив к запуску
        uses: actions/upload-artifact@v4
        with:
          name: vitruvium-${{ github.sha }}
          path: build/
          retention-days: 30
          if-no-files-found: error

  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код с историей
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Проверить, записаны ли изменения в CHANGELOG.md
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "Не с чем сравнить (новая ветка или переписанная история)."
            exit 0
          fi
          CHANGED="$(git diff --name-only "$BASE" "$HEAD")"
          CODE="$(echo "$CHANGED" | grep -E '^(module|templates|styles|lang|assets|fonts|journals)/|^system\.json$' || true)"
          if [ -n "$CODE" ] && ! echo "$CHANGED" | grep -qx 'CHANGELOG.md'; then
            echo "::warning title=CHANGELOG.md::Код системы изменился, а CHANGELOG.md нет. Запишите изменение со знаком 🔧, ✅ или 📄."
            echo "Изменённые файлы системы:"
            echo "$CODE"
          else
            echo "В порядке."
          fi
